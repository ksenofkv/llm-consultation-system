# bot_service/pytest.ini

"""
Конфигурация pytest для Bot Service.

Здесь:
- настраивается PYTHONPATH
- включается поддержка async тестов
- отключаются лишние warnings
- обеспечивается корректная работа pytest-asyncio
"""

[pytest]

# Добавление корня проекта в PYTHONPATH
# Позволяет импортировать app.*
pythonpath = .

# Автоматическая поддержка async/await тестов
asyncio_mode = auto

# Отключение лишних warning сообщений
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning