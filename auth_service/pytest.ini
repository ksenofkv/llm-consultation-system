# auth_service/pytest.ini

"""
Конфигурация pytest для Auth Service.

Здесь:
- настраивается запуск тестов
- подключается pythonpath
- включается поддержка asyncio
- отключаются лишние warnings
"""

[pytest]

# Добавляет корень проекта в PYTHONPATH
# Позволяет импортировать app.*
pythonpath = .

# Автоматическая поддержка async тестов
asyncio_mode = auto

# Отключение лишних warning сообщений
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning